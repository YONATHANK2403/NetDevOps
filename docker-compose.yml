---
# Socle NetDevOps : 3 zones isolées (DMZ, LAN, MGMT) reliées par router-fw
name: netdevops

x-routed: &routed
  restart: unless-stopped
  cap_add: [NET_ADMIN]   # uniquement pour ajouter la route vers router-fw au démarrage

services:
  router-fw:
    build: ./docker/router-fw
    image: netdevops/router-fw:latest
    container_name: router-fw
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "8080:80"     # Internet -> DNAT -> web-dmz:80
      - "8443:443"    # Internet -> DNAT -> web-dmz:443
    volumes:
      - ./docker/router-fw/nftables.conf:/etc/nftables.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nft list ruleset | grep -q 'policy drop'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      dmz-net: {ipv4_address: 172.20.1.1}
      lan-net: {ipv4_address: 172.20.2.1}
      mgmt-net: {ipv4_address: 172.20.3.1}

  web-dmz:
    <<: *routed
    build: ./docker/web-dmz
    image: netdevops/web-dmz:latest
    container_name: web-dmz
    entrypoint: ["/bin/sh", "-c", "sh /set-routes.sh && exec nginx -g 'daemon off;'"]
    environment:
      GW: 172.20.1.1
      ROUTES: "172.20.2.0/24 172.20.3.0/24"
    volumes:
      - ./docker/common/set-routes.sh:/set-routes.sh:ro
      - ./docker/web-dmz/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web-dmz/html:/usr/share/nginx/html:ro
      - ./docker/web-dmz/certs:/etc/nginx/certs:ro
    depends_on: [router-fw]
    networks:
      dmz-net: {ipv4_address: 172.20.1.10}

  dns-lan:
    <<: *routed
    build: ./docker/dns-lan
    image: netdevops/dns-lan:latest
    container_name: dns-lan
    entrypoint: ["/bin/sh", "-c", "sh /set-routes.sh && exec dnsmasq -k -C /etc/dnsmasq.conf --log-facility=-"]
    environment:
      GW: 172.20.2.1
      ROUTES: "172.20.1.0/24 172.20.3.0/24"
    volumes:
      - ./docker/common/set-routes.sh:/set-routes.sh:ro
      - ./docker/dns-lan/dnsmasq.conf:/etc/dnsmasq.conf:ro
    depends_on: [router-fw]
    networks:
      lan-net: {ipv4_address: 172.20.2.10}

  client-1: &client
    <<: *routed
    build: ./docker/client
    image: netdevops/client:latest
    container_name: client-1
    entrypoint: ["/bin/sh", "-c", "sh /set-routes.sh && exec sleep infinity"]
    environment:
      GW: 172.20.2.1
      ROUTES: "172.20.1.0/24 172.20.3.0/24"
    dns: [172.20.2.10]
    volumes:
      - ./docker/common/set-routes.sh:/set-routes.sh:ro
    depends_on: [router-fw, dns-lan]
    networks:
      lan-net: {ipv4_address: 172.20.2.100}

  client-2:
    <<: *client
    container_name: client-2
    networks:
      lan-net: {ipv4_address: 172.20.2.101}

networks:
  dmz-net:
    external: true
    name: dmz-net

  lan-net:
    external: true
    name: lan-net

  mgmt-net:
    external: true
    name: mgmt-net
