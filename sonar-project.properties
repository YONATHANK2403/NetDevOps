sonar.projectKey=netdevops
sonar.projectName=NetDevOps
sonar.sources=ansible,scripts,docker,docker-compose.yml,docker-compose.monitoring.yml,docker-compose.tools.yml,Jenkinsfile
sonar.exclusions=**/*.json,docker/web-dmz/certs/**
sonar.python.version=3
sonar.qualitygate.wait=true

# Tests unitaires Python et rapport de couverture
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
