---
# Supervision (zone Management) : à combiner avec docker-compose.yml
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"   # accessible uniquement depuis l'hôte
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      mgmt-net: {ipv4_address: 172.20.3.10}

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks:
      mgmt-net: {ipv4_address: 172.20.3.11}

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    networks:
      mgmt-net: {ipv4_address: 172.20.3.30}

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    user: root
    cap_add: [NET_ADMIN]   # pour la route vers les autres zones via router-fw
    entrypoint:
      - /bin/sh
      - -c
      - sh /set-routes.sh && exec /bin/blackbox_exporter --config.file=/etc/blackbox/blackbox.yml
    environment:
      GW: 172.20.3.1
      ROUTES: "172.20.1.0/24 172.20.2.0/24"
    volumes:
      - ./docker/common/set-routes.sh:/set-routes.sh:ro
      - ./docker/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    depends_on: [router-fw]
    networks:
      mgmt-net: {ipv4_address: 172.20.3.20}

volumes:
  prometheus-data:
  grafana-data:
