---
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Sondes depuis la zone Management vers le web et le DNS (à travers le pare-feu)
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://172.20.1.10"]
    relabel_configs: &probe_relabel
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox-exporter:9115"}

  - job_name: blackbox-https
    metrics_path: /probe
    params: {module: [http_2xx_tls]}
    static_configs:
      - targets: ["https://172.20.1.10"]
    relabel_configs: *probe_relabel

  - job_name: blackbox-dns
    metrics_path: /probe
    params: {module: [dns_web]}
    static_configs:
      - targets: ["172.20.2.10:53"]
    relabel_configs: *probe_relabel
