---
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4

  http_2xx_tls:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  dns_web:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: web.pme.local
      query_type: A
      validate_answer_rrs:
        fail_if_not_matches_regexp: ["web\\.pme\\.local\\.\\s+.*\\s+IN\\s+A\\s+172\\.21\\.1\\.10"]
