---
- name: Générer le fichier .env (secrets issus d'Ansible Vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Démarrer ou mettre à jour la pile Docker Compose
  ansible.builtin.command:
    cmd: "{{ compose_cmd }} up -d --build --remove-orphans"
    chdir: "{{ project_dir }}"
  register: stack_up
  changed_when: "'Started' in stack_up.stderr or 'Recreated' in stack_up.stderr or 'Built' in stack_up.stderr"
