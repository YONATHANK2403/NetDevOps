---
- name: Créer le dossier de configuration nftables
  ansible.builtin.file:
    path: "{{ firewall_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Générer les règles nftables du routeur
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_config_path }}"
    mode: "0644"
  notify: Recharger la configuration des services
